<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier des Umbras I · Index 14</title>
<style>
:root { color-scheme: dark; --bg:#101316; --panel:#181d21; --line:#343e46; --text:#edf0f1; --muted:#a8b4bc; --gold:#ddc68d; --force:#ff8c86; --intelligence:#a99cff; --agility:#e1cc74; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,sans-serif; }
main { max-width:1900px; margin:auto; padding:20px; }
h1,h2,p { margin:0; } h1 { font:26px Georgia,serif; } h2 { font-size:14px; font-weight:600; }
button,input { font:inherit; color:inherit; }
button { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:7px 10px; cursor:pointer; }
button:hover:not(:disabled) { border-color:var(--gold); } button:disabled { opacity:.35; cursor:default; }
input { background:#101519; border:1px solid #46535e; border-radius:4px; padding:6px; min-width:0; font-variant-numeric:tabular-nums; }
input[type=number] { width:80px; } :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
header,.controls,.tools { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
header { justify-content:space-between; padding-bottom:16px; border-bottom:1px solid var(--line); }
.subtitle,.muted,small { color:var(--muted); } .subtitle { margin-top:5px; }
.controls { margin:15px 0 8px; gap:10px 22px; } .controls label { display:flex; gap:8px; align-items:center; }
[data-ui=mode-toggle] { border-color:var(--gold); } [data-ui=mode-toggle][aria-pressed=true] { border-color:#87badb; color:#b9def4; }
[data-ui=current-rules] { margin-top:12px; }
.entity-toolbar,.entity-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
.entity-toolbar { margin:18px 0; }
.entities { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,640px),1fr)); gap:18px; align-items:start; }
.entity { min-width:0; padding:16px; border:1px solid var(--line); border-radius:6px; container:entity / inline-size; }
.entity-header { padding-bottom:12px; border-bottom:1px solid var(--line); }
.entity-header label { min-width:0; flex:1 1 180px; color:var(--muted); font-size:12px; }
.entity-name { display:block; width:100%; max-width:320px; margin-top:4px; font-size:17px; }
.entity-header .tools { gap:5px; } .entity-header button { font-size:12px; }
.stat-totals { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin:12px 0; }
.stat-total { padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:4px; }
.stat-total>span { display:block; font-size:12px; } .stat-total output { display:block; color:var(--gold); font-size:21px; font-weight:600; }
.stat-total small { display:block; margin-top:4px; line-height:1.5; }
.context { margin-bottom:15px; font-size:12px; color:var(--muted); }
.pickers { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin:18px 0; }
.picker { position:relative; min-width:0; }
.picker>summary { padding:11px 13px; border:1px solid var(--line); border-radius:5px; background:var(--panel); }
.picker[open]>summary { border-color:var(--gold); }
.picker-panel { position:absolute; top:calc(100% + 5px); left:0; width:100%; min-width:255px; z-index:10; padding:10px; background:var(--panel); border:1px solid var(--line); border-radius:5px; box-shadow:0 8px 18px #0006; }
.picker:nth-last-child(-n+2) .picker-panel { left:auto; right:0; }
.picker input { width:100%; } .picker-options { max-height:265px; overflow-y:auto; margin:8px 0 0; padding:0; list-style:none; }
.picker-options button { width:100%; display:flex; justify-content:space-between; gap:8px; padding:8px; text-align:left; border:0; }
.picker-options button:hover,.picker-options button:focus-visible { background:#293139; }
.picker-options small { white-space:nowrap; color:var(--gold); } .no-match { padding:10px 5px; color:var(--muted); }
.empty { padding:40px 16px; text-align:center; border:1px dashed var(--line); color:var(--muted); }
[hidden] { display:none!important; }
.stepper { display:inline-flex; align-items:center; gap:3px; white-space:nowrap; }
.stepper button { padding:3px; width:26px; min-height:32px; } .stepper input { width:64px; text-align:center; }
.stepper input::-webkit-inner-spin-button { appearance:none; }
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
caption { text-align:left; margin-bottom:8px; color:var(--muted); font-size:12px; }
th { color:var(--muted); font-size:11px; letter-spacing:.02em; text-align:left; font-weight:500; }
th,td { padding:9px 7px; border-bottom:1px solid var(--line); vertical-align:middle; }
th:first-child,td:first-child { padding-left:0; }
td input { width:65px!important; } .effect-name { border:0; background:transparent; padding:0; text-align:left; font-weight:500; color:var(--text); text-decoration:underline dotted #71808b; text-underline-offset:4px; }
.source-name { display:block; font-size:11px; color:var(--muted); margin-top:4px; }
.ratio { font-size:12px; max-width:350px; } .ratio small { display:block; font-size:11px; }
.total { font-size:15px; font-weight:600; color:var(--gold); } .total small { display:block; font-size:11px; font-weight:400; color:var(--muted); }
.total span { display:block; } .remove { padding:3px 9px; color:var(--muted); font-size:18px; }
.detail-row[hidden] { display:none; } .detail-row td { padding:12px 14px; background:var(--panel); }
.detail-title { color:var(--gold); margin-bottom:8px; }
.calculation { display:grid; grid-template-columns:minmax(140px,.7fr) minmax(0,1.7fr); gap:5px 16px; }
.calculation dt { color:var(--muted); } .calculation dd { margin:0; overflow-wrap:anywhere; }
.calculation .result { color:var(--gold); font-weight:600; } .description { margin-bottom:8px; }
.milestones { margin-top:12px; max-width:650px; } .milestones th,.milestones td { padding:5px 8px; font-size:12px; }
.milestones tr[data-current=true] { color:var(--gold); } .compare { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
.notice { margin-top:8px; color:var(--muted); font-size:12px; } [data-ui=status] { min-height:22px; margin-top:12px; color:var(--gold); }
details.rules { margin-top:18px; border-top:1px solid var(--line); padding-top:12px; color:var(--muted); font-size:12px; }
summary { cursor:pointer; color:var(--text); } .rules ul { padding-left:20px; } .rules li { margin:5px 0; }
.rules .controls { margin:10px 0; } footer { margin-top:16px; color:var(--muted); font-size:12px; }
.gift-settings { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:10px; }
.gift-settings label { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.gift-settings input { flex:0 0 65px; width:65px; }
.source-effect { margin:10px 0; padding:10px; border:1px solid var(--line); }
@media(max-width:760px) { main { padding:14px; } .entity { padding:12px; } }
@container entity (max-width:640px) {
  .pickers { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .picker:nth-child(even) .picker-panel { left:auto; right:0; } .gift-settings { grid-template-columns:1fr; }
  .picker:nth-child(odd) .picker-panel { left:0; right:auto; }
  .table-wrap { max-width:100%; }
  [data-ui=effects-table],[data-ui=effects-table]>caption,[data-ui=effects] { display:block; } [data-ui=effects-table]>thead { display:none; }
  [data-ui=effects]>tr[data-entry] { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; margin-top:12px; padding:12px; border:1px solid var(--line); }
  [data-ui=effects]>tr[data-entry]>td { padding:0; border:0; min-width:0; }
  [data-ui=effects]>tr[data-entry]>td:first-child { grid-column:1; grid-row:1; }
  [data-ui=effects]>tr[data-entry]>td:last-child { grid-column:2; grid-row:1; text-align:right; }
  [data-ui=effects]>tr[data-entry]>td:nth-child(3) { grid-column:1/-1; }
  [data-ui=effects]>tr[data-entry]>td:nth-child(4) { grid-column:1/-1; }
  [data-ui=effects]>tr[data-entry]>td[data-label]:not(:first-child)::before { content:attr(data-label); display:block; margin-bottom:4px; color:var(--muted); font-size:10px; font-weight:400; }
  .ratio { max-width:none; }
  .detail-row:not([hidden]),.detail-row>td { display:block; }
  .detail-row>td { padding:12px; } .milestones { max-width:100%; }
  .milestones th,.milestones td { padding:5px 3px; font-size:11px; } .compare,.description { overflow-wrap:anywhere; }
}
@container entity (max-width:460px) { .calculation { grid-template-columns:1fr; gap:3px; } .calculation dd { margin-bottom:7px; } }
@media(max-width:460px) { h1 { font-size:23px; } }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Atelier des Umbras I</h1><p class="subtitle">Index 14 · Acquisition, ratios et calculs en direct.</p></div>
  </header>
  <div class="entity-toolbar"><h2>Entités</h2><button type="button" id="add-entity">+ Entité</button></div>
  <div class="entities" id="entities"></div>
  <p class="empty" id="no-entities" hidden>Ajoutez une entité pour commencer.</p>
  <template id="entity-template">
  <section class="entity">
  <div class="entity-header">
    <label>Nom de l’entité<input class="entity-name" type="text" maxlength="100" autocomplete="off"></label>
    <div class="tools"><button type="button" id="example">Exemple PP</button><button type="button" id="clear">Vider</button><button type="button" data-remove-entity>− Entité</button></div>
  </div>
  <div class="controls">
    <button type="button" id="mode-toggle" aria-pressed="false" aria-label="Passer à la version actuelle">Calculs : <strong id="mode-name">Concept</strong> ⇄</button>
    <label>Niveau <input id="level" type="number" min="1" step="1" value="1"></label>
    <label>Limite de l’entité <input id="limit" type="number" min="0" step="1" value="150"></label>
  </div>
  <p class="notice">Mêmes éléments et mêmes saisies dans les deux modes. Seuls les calculs appliqués changent.</p>
  <section class="pickers" aria-label="Ajouter au tableau" id="pickers"></section>
  <section aria-label="Calcul des statistiques">
    <div class="stat-totals" id="stat-totals" aria-label="Totaux des statistiques"></div>
    <p class="empty" id="empty">Choisissez un élément dans une liste pour l’ajouter au tableau.</p>
    <div class="table-wrap">
      <table id="effects-table" hidden>
        <caption>Apport de chaque ligne. Les vues X sont déjà comprises dans l’Umbra. Cliquez sur un nom pour le détail.</caption>
        <thead><tr><th scope="col">Élément</th><th scope="col">Points</th><th scope="col">Ratio / effet</th><th scope="col">Contribution de la ligne</th><th scope="col"><span class="muted">Retirer</span></th></tr></thead>
        <tbody id="effects"></tbody>
      </table>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </section>
  <details class="rules">
    <summary>Règles et paramètres communs</summary>
    <div id="concept-settings">
    <p>Paramètres du concept · toujours modifiables, appliqués uniquement au calcul Concept.</p>
    <div class="controls"><label>Demi-progression K <input id="curve-k" type="number" min="0.01" step="1" value="30"></label><label>Multiplicateur maximal <input id="curve-max" type="number" min="1" step="0.1" value="3"></label></div>
    <details><summary>Dons fixes par point d’Umbra</summary><div class="gift-settings" id="gift-settings"></div></details>
    <ul>
      <li>Multiplicateur M(U) = 1 + (maximum − 1) × U / (U + K). U est le nombre de points de l’Umbra concernée.</li>
      <li>Sans Umbra, une stat+ active un coefficient fixe. Avec l’Umbra, son coefficient remplace celui de la stat+ ; il n’est jamais additionné une seconde fois.</li>
      <li>Le don fixe de l’Umbra s’ajoute à sa capacité calculée. Les dons initiaux sont de 1 par point pour l’effet principal et de 0 pour les effets secondaires ; chaque valeur est réglable.</li>
      <li>Dans le concept, chaque attribut et chaque Umbra partage la limite de l’entité. Les points retenus pour le calcul sont plafonnés ; les points saisis restent intacts, même en cas de baisse de limite.</li>
      <li>Les gains fixes n’ont pas de plafond d’acquisition. Les plafonds d’effet restent 100 % pour les résistances et l’esquive, et 95 % pour les effets de Hâte.</li>
      <li>Chaque contribution d’attribut est arrondie au supérieur après multiplication : 25 × 0,5 → 13. Les coefficients restent précis pendant le calcul.</li>
      <li>Les courbes natives des effets sont conservées. Les ratios d’attributs utilisent M(U). Vitalité conserve sa régénération liée aux HP ; Précision conserve son bonus applicable aux coups critiques.</li>
      <li>Volonté reste saisissable et limitée, mais ne pilote aucun effet de ce périmètre. Aucun archétype, cycle, équipement ou stock de ressources n’est simulé.</li>
      <li>Le niveau est un repère manuel, sans gain automatique. Retirer une ligne retire son apport ; retirer une stat X ferme seulement sa vue calculée.</li>
    </ul>
    </div>
    <div id="current-rules">
      <p>Version actuelle : formules des JS du projet (statSystem.js, damagesCalcul.js, entites.js et balanceData.js).</p>
      <p>Ratios, arrondis et plafonds propres à chaque effet. Le don fixe supplémentaire, la courbe globale et la limite commune du concept ne s’appliquent pas.</p>
      <p>Les mêmes saisies sont conservées dans les deux modes. La réduction d’esquive adverse vient directement de Précision ; ses apports fixe/+ du concept n’ont pas d’équivalent actuel.</p>
    </div>
    <p class="notice">Les totaux additionnent les apports une seule fois. Si un plafond est atteint, les contributions affichées sont réparties dans l’ordre : fixe, stat+, Umbra.</p>
  </details>
  </section>
  </template>
  <footer>Simulation autonome · Aucune lecture ni écriture des sauvegardes du jeu.</footer>
</main>
<script>
/* Standalone snapshot of rank-1 native effects. Source: balanceData.js,
   entites.js, entityRules.js and damagesCalcul.js. Only this lab applies the
   proposed acquisition limit, shared ratio curve and additional fixed grants. */
(() => {
  'use strict';
  const ATTRIBUTES = [
    { key:'strength', name:'Force' }, { key:'intelligence', name:'Intelligence' },
    { key:'agility', name:'Agilité' }, { key:'will', name:'Volonté' },
  ];
  const UMBRAS = [
    { key:'vigueur', name:'Vigueur', axis:'strength', role:'Attaque' },
    { key:'constitution', name:'Constitution', axis:'strength', role:'Défense' },
    { key:'vitality', name:'Vitalité', axis:'strength', role:'Utilitaire' },
    { key:'esprit', name:'Esprit', axis:'intelligence', role:'Attaque' },
    { key:'integrite', name:'Intégrité', axis:'intelligence', role:'Défense' },
    { key:'haste', name:'Hâte', axis:'intelligence', role:'Utilitaire' },
    { key:'finesse', name:'Finesse', axis:'agility', role:'Attaque' },
    { key:'adresse', name:'Adresse', axis:'agility', role:'Défense' },
    { key:'precision', name:'Précision', axis:'agility', role:'Utilitaire' },
  ];
  const EFFECTS = [
    { key:'physicalDamage', name:'Puissance physique', source:'vigueur', type:'power', attribute:'strength', coefficient:.5, gift:1, unit:'', description:'Renforce les dégâts des attaques qui utilisent la puissance physique.' },
    { key:'physicalResistance', name:'Résistance physique', source:'constitution', type:'resistance', attribute:'strength', coefficient:.5, gift:1, unit:' %', cap:100, description:'Réduit les dégâts physiques subis.' },
    { key:'HP', name:'HP max', source:'vitality', type:'hp', gift:1, unit:'', description:'Détermine les points de vie maximum. Aucun ratio de Force n’est ajouté à cette mécanique.' },
    { key:'dayHpRegen', name:'Régénération journalière', source:'vitality', type:'regen', gift:0, unit:' HP', description:'HP récupérés au début de la journée si l’entité est vivante. Utilise les HP max calculés ci-dessus.' },
    { key:'magicalDamage', name:'Puissance magique', source:'esprit', type:'power', attribute:'intelligence', coefficient:.5, gift:1, unit:'', description:'Renforce les dégâts des attaques qui utilisent la puissance magique.' },
    { key:'magicalResistance', name:'Résistance magique', source:'integrite', type:'resistance', attribute:'intelligence', coefficient:.5, gift:1, unit:' %', cap:100, description:'Réduit les dégâts magiques subis.' },
    { key:'attackPreparationReduc', name:'Préparation', source:'haste', type:'preparation', attribute:'intelligence', coefficient:30/150, gift:1, unit:' %', cap:95, description:'Réduit la durée de préparation des attaques.' },
    { key:'attackCooldownReduc', name:'Cooldown', source:'haste', type:'timing', attribute:'intelligence', coefficient:25/150, gift:0, unit:' %', cap:95, description:'Réduit le délai avant de pouvoir relancer une attaque.' },
    { key:'attackExecutionReduc', name:'Exécution', source:'haste', type:'timing', attribute:'strength', coefficient:25/150, gift:0, unit:' %', cap:95, description:'Réduit la durée d’exécution des attaques.' },
    { key:'attackRecoveryReduc', name:'Récupération', source:'haste', type:'timing', attribute:'agility', coefficient:25/150, gift:0, unit:' %', cap:95, description:'Réduit la durée de récupération après une attaque.' },
    { key:'attackProjectileSpeed', name:'Vitesse des projectiles', source:'haste', type:'projectile', attribute:'strength', coefficient:25/150, gift:0, unit:' %', cap:95, description:'Augmente la vitesse des projectiles. Le ratio de Force est converti en accélération.' },
    { key:'piercingDamage', name:'Puissance perçante', source:'finesse', type:'power', attribute:'agility', coefficient:.5, gift:1, unit:'', description:'Renforce les dégâts des attaques qui utilisent la puissance perçante.' },
    { key:'dodge', name:'Esquive', source:'adresse', type:'dodge', attribute:'agility', coefficient:.5, gift:1, unit:' %', cap:100, description:'Chance d’esquiver les attaques esquivables.' },
    { key:'precisionReduction', name:'Réduction d’esquive adverse', source:'precision', type:'precision', gift:1, unit:' %', cap:100, description:'Réduit l’esquive adverse. En combat, la cible conserve sa chance minimale d’esquiver.' },
    { key:'criticalDamage', name:'Bonus de dégâts critiques', source:'precision', type:'critical', gift:0, unit:' %', description:'Bonus fourni par Précision aux attaques qui réalisent un coup critique. N’accorde aucune chance de critique.' },
  ];
  const number = value => Number.isFinite(Number(value)) ? Math.max(0, Number(value)) : 0;
  const ceiling = (value, decimals=0) => {
    const factor = 10 ** decimals, scaled = value * factor;
    return Math.ceil(scaled - Number.EPSILON * Math.max(1, Math.abs(scaled)) * 4) / factor || 0;
  };
  const nearest = (value, decimals=0) => Math.round(value * 10 ** decimals) / 10 ** decimals;
  const multiplier = (points, curve={}) => 1 + (Math.max(1, number(curve.max ?? 3)) - 1) * points / (points + Math.max(.01, number(curve.k ?? 30)));
  function initialState(example=false) {
    return { mode:'concept', level:example ? 51 : 1, limit:150, curve:{ k:30, max:3 },
      attributes:Object.fromEntries(ATTRIBUTES.map(a => [a.key, example && a.key==='strength' ? 60 : 0])),
      umbras:Object.fromEntries(UMBRAS.map(u => [u.key, example && u.key==='vigueur' ? 15 : 0])),
      fixed:{}, plus:{}, gifts:Object.fromEntries(EFFECTS.map(effect => [effect.key,effect.gift])) };
  }
  // No random input, side effects, game imports or storage. Fixed inputs are
  // never subjected to the acquisition limit; only effect outputs may be capped.
  function calculate(input) {
    if(input.mode==='current')return calculateCurrent(input);
    const limit = number(input.limit ?? 150);
    const attributes = Object.fromEntries(ATTRIBUTES.map(a => [a.key,Math.min(limit,number(input.attributes?.[a.key]))]));
    const umbras = Object.fromEntries(UMBRAS.map(u => [u.key,Math.min(limit,number(input.umbras?.[u.key]))]));
    const results = {};
    for (const spec of EFFECTS) {
      const u=umbras[spec.source], fixed=number(input.fixed?.[spec.key]), plus=number(input.plus?.[spec.key]);
      const active=u>0 || plus>0, m=u>0 ? multiplier(u,input.curve) : 1;
      const coefficient=active && spec.attribute ? spec.coefficient*m : 0;
      const attributeValue=spec.attribute ? attributes[spec.attribute] : 0;
      const attributeRaw=attributeValue*coefficient;
      const attributeGain=ceiling(attributeRaw);
      const giftRate=number(input.gifts?.[spec.key] ?? spec.gift);
      const gift=ceiling(u*giftRate, spec.unit.includes('%') ? 2 : 0);
      let native=0, generated=0, points=0, nativeRatio=0, common=0;
      if (spec.type==='power') { native=u; generated=ceiling(native)+attributeGain; }
      if (spec.type==='resistance' || spec.type==='dodge') {
        native=u; points=ceiling(u)+attributeGain;
        if (points>0) generated=spec.type==='resistance' ? ceiling(100*points/(points+70))
          : points===1 ? 5 : Math.min(72,nearest(5+67*(1-Math.exp(-.02*(points-1))),1));
      }
      if (spec.type==='hp') { native=u<=0 ? 0 : u===1 ? 10 : Math.min(400,ceiling(10+390*(1-Math.exp(-.02*(u-1))))); generated=native; }
      if (spec.type==='regen') {
        // The original 150 is an explicit fixed conversion coefficient, not
        // a second hidden acquisition cap or a denominator depending on limit.
        nativeRatio=u*(5/150)/100;
        common=active ? 1 : 0;
        native=ceiling((results.HP?.total || 0)*nativeRatio);
        generated=native+common;
      }
      if (spec.type==='preparation') { native=u<=0 ? 0 : u===1 ? 1.5 : Math.min(35,nearest(1.5+33.5*(1-Math.exp(-u/70)),1)); generated=native+attributeGain; }
      if (spec.type==='timing') generated=attributeGain;
      if (spec.type==='projectile') generated=ceiling(100*(1/(1-Math.min(95,attributeGain)/100)-1),2);
      if (spec.type==='precision') { native=u<=0 ? 0 : u===1 ? 5 : Math.min(80,nearest(5+75*(1-Math.exp(-.025*(u-1))),1)); generated=native; }
      if (spec.type==='critical') { native=ceiling(u*.5,1); generated=native; }
      const uncapped=nearest(fixed+plus+gift+generated,8);
      const total=Math.min(spec.cap ?? Infinity,uncapped);
      results[spec.key]={ ...spec, u, fixed, plus, active, multiplier:m, coefficient, attributeValue, attributeRaw, attributeGain,
        giftRate, gift, native, nativeRatio, common, generated, points, uncapped, total,
        state:u>0 ? 'X' : plus>0 ? '+' : 'normal', capped:uncapped>total, capLoss:nearest(uncapped-total,8) };
    }
    return { mode:'concept', level:Math.max(1,Math.floor(number(input.level))), limit, attributes, umbras, results };
  }
  // Numerical snapshot of the current local JS. No concept grants, global
  // multiplier or common acquisition cap are applied by this calculator.
  // The verification script compares it against those JS functions directly.
  function calculateCurrent(input) {
    const attributes=Object.fromEntries(ATTRIBUTES.map(a=>[a.key,number(input.attributes?.[a.key])]));
    const umbras=Object.fromEntries(UMBRAS.map(u=>[u.key,number(input.umbras?.[u.key])]));
    const results={};
    for(const original of EFFECTS) {
      const spec=original.type==='critical'?{...original,attribute:'agility',coefficient:.4}:original;
      const u=umbras[spec.source], fixed=number(input.fixed?.[spec.key]), plus=number(input.plus?.[spec.key]);
      const supportsDirect=spec.type!=='precision', fixedApplied=supportsDirect?fixed:0, plusApplied=supportsDirect?plus:0;
      // In this rank-one scope, criticalPower is absent. criticalDamagePlus
      // activates the current critical damage rule; Precision alone does not.
      const active=spec.type==='critical'?plus>0:u>0 || plusApplied>0;
      const coefficient=active && spec.attribute?spec.coefficient:0;
      const attributeValue=spec.attribute?attributes[spec.attribute]:0;
      const attributeUsed=spec.source==='haste'?Math.min(150,Number(attributeValue.toFixed(2))):attributeValue;
      const attributeRaw=spec.source==='haste'?(attributeUsed/150)*(coefficient*150):attributeUsed*coefficient;
      const attributeGain=spec.source==='haste'?Math.round(attributeRaw):spec.type==='critical'?nearest(attributeRaw,1):attributeRaw;
      let native=0, generated=0, points=0, nativeRatio=0, common=0;
      const shared=['power','resistance','dodge'].includes(spec.type);
      if(shared) {
        native=u; points=nearest(native+attributeGain);
        if(spec.type==='power')generated=points;
        if(spec.type==='resistance')generated=points>0?Math.ceil((points/(points+70))*100):0;
        if(spec.type==='dodge')generated=points<=0?0:points===1?5:Math.min(72,Number((5+67*(1-Math.exp(-.02*(points-1)))).toFixed(1)));
      }
      if(spec.type==='hp') { native=u<=0?0:u===1?10:Math.min(400,Math.ceil(10+390*(1-Math.exp(-.02*(u-1))))); generated=native; }
      if(spec.type==='regen') {
        nativeRatio=Number(((Math.min(u,150)/150)*5).toFixed(2))/100;
        native=Math.round(results.HP.total*nativeRatio); common=active?1:0; generated=native+common;
      }
      if(spec.type==='preparation') { native=u<=0?0:u===1?1.5:Math.min(35,Number((1.5+33.5*(1-Math.exp(-u/70))).toFixed(2))); generated=native+attributeGain; }
      if(spec.type==='timing')generated=attributeGain;
      if(spec.type==='projectile')generated=nearest((1/(1-Math.min(95,attributeGain)/100)-1)*100,2);
      if(spec.type==='precision') { native=u<=0?0:u===1?5:Math.min(80,Number((5+75*(1-Math.exp(-.025*(u-1)))).toFixed(1))); generated=native; }
      if(spec.type==='critical') { native=active?nearest(u*.5,1):0; common=active?50:0; generated=common+native+attributeGain; }
      let enhanced=plusApplied+generated;
      if(spec.type==='hp')enhanced=Math.ceil(enhanced);
      if(spec.type==='regen')enhanced=Math.floor(enhanced);
      if(spec.source==='haste' || spec.type==='critical')enhanced=nearest(enhanced,1);
      const uncapped=nearest(fixedApplied+enhanced,6), total=nearest(Math.min(spec.cap??Infinity,uncapped),6);
      results[spec.key]={...spec,u,fixed,plus,fixedApplied,plusApplied,supportsDirect,active,multiplier:1,
        coefficient,attributeValue,attributeUsed,attributeRaw,attributeGain,giftRate:0,gift:0,native,nativeRatio,common,generated,points,uncapped,total,
        roundingAdjustment:nearest(uncapped-fixedApplied-plusApplied-generated,6),
        state:u>0&&active?'X':plusApplied>0?'+':'normal',capped:uncapped>total,capLoss:nearest(uncapped-total,6)};
    }
    return {mode:'current',level:Math.max(1,Math.floor(number(input.level))),limit:number(input.limit??150),attributes,umbras,results};
  }
  function contributions(row,mode='concept') {
    const fixed=Math.min(row.total,Math.max(0,row.fixedApplied??row.fixed));
    const hasUmbra=row.u>0 && row.active;
    let plusClaim=row.plusApplied??row.plus;
    if(!hasUmbra)plusClaim=row.total-fixed;
    else if(mode==='current' && row.type==='critical')plusClaim+=row.common+row.attributeGain;
    const plus=Math.min(Math.max(0,row.total-fixed),Math.max(0,plusClaim));
    const umbra=Math.max(0,row.total-fixed-plus);
    // X is a view of the capability already carried by its Umbra, never a
    // fourth acquisition. Apply effect caps once, then reconcile the parts.
    const x=hasUmbra?Math.min(row.generated,Math.max(0,umbra-row.gift)):0;
    return {fixed:nearest(fixed,8),plus:nearest(plus,8),umbra:nearest(umbra,8),x:nearest(x,8)};
  }
  window.umbraLab = Object.freeze({ calculate, initialState, multiplier, ceiling, contributions, attributes:ATTRIBUTES, umbras:UMBRAS, effects:EFFECTS });
})();
</script>
<script>
(() => {
  'use strict';
  function mountEntity(root,serial) {

    {id:'plus',name:'Stats +',entries:Lab.effects.map(spec=>entry('plus','plus','plus',spec,`${spec.name} +`))},
    {id:'x',name:'Stats X',entries:Lab.effects.map(spec=>entry('x','x',null,spec,`${spec.name} X`))},
    {id:'umbras',name:'Umbras',entries:Lab.umbras.map(spec=>entry('umbras','umbra','umbras',spec,spec.name))},
    {id:'attributes',name:'Attributs',entries:Lab.attributes.map(spec=>entry('attributes','attribute','attributes',spec,spec.name))},
  ];
  const entries=Object.fromEntries(catalogs.flatMap(catalog=>catalog.entries.map(item=>[item.id,item])));
  const kindNames={attribute:'Attribut',fixed:'Stat fixe',plus:'Stat +',x:'Stat X · calculée',umbra:'Umbra · niveau 1'};
  const normalize=text=>text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  const readNumber=input=>Math.max(0,Number.isFinite(input.valueAsNumber) ? input.valueAsNumber : 0);
  const cell=(label,child)=>{ const td=document.createElement('td'); td.dataset.label=label; if(child)td.append(child); return td; };

  }

      button.setAttribute('aria-label',`${delta<0?'Diminuer':'Augmenter'} ${label}`);

  }
  for(const catalog of catalogs) {
    const picker=document.createElement('details'); picker.className='picker'; picker.dataset.catalog=catalog.id;
    picker.innerHTML=`<summary>${catalog.name}</summary><div class="picker-panel"><input type="search" placeholder="Rechercher…" aria-label="Rechercher dans ${catalog.name}" autocomplete="off"><ul class="picker-options"></ul><p class="no-match" hidden>Aucun résultat.</p></div>`;
    for(const item of catalog.entries) {
      const li=document.createElement('li'), button=document.createElement('button'); button.type='button'; button.dataset.add=item.id;

  }
  for(const spec of Lab.effects) {

  }
  function filterPicker(picker) {

  }
  function addEntry(item,acquire=true) {

  }
  function withUmbra(key,value) { return {...state,umbras:{...state.umbras,[key]:isConcept()?Math.min(state.limit,value):value}}; }
  function formula(row,snapshot) {
    const f=value=>fmt(value,6), n=row.native;
    if(snapshot.mode==='current') {
      if(!row.active)return 'Capacité inactive.';
      if(['power','resistance','dodge'].includes(row.type)) {
        const pool=`${f(row.u)} + ${f(row.attributeGain)} → ${f(row.points)} points (arrondi au plus proche)`;
        if(row.type==='power')return pool;
        if(row.type==='resistance')return `${pool} ; ${f(row.points)} / (${f(row.points)} + 70) × 100 → ${f(row.generated)} %`;
        return `${pool} ; courbe d’esquive → ${f(row.generated)} %`;
      }
      if(row.type==='regen')return `${f(snapshot.results.HP.total)} HP × ${f(row.nativeRatio*100)} % → ${f(n)} HP (arrondi au plus proche) ; taux : min(Vitalité, 150) / 150 × 5, arrondi à 2 décimales`;
    }
    if(row.type==='power') return `${f(row.u)} × 1 → ${f(Math.ceil(row.u))}`;
    if(row.type==='resistance') return `(${f(row.u)} → ${f(Math.ceil(row.u))}) + ${f(row.attributeGain)} = ${f(row.points)} points ; ${f(row.points)} / (${f(row.points)} + 70) × 100 → ${f(row.generated)} %`;
    if(row.type==='dodge') return row.points<=0 ? '0' : row.points===1 ? 'Premier point : 5 %' : `${f(row.u)} + ${f(row.attributeGain)} = ${f(row.points)} points ; 5 + 67 × (1 − exp(−0,02 × (${f(row.points)} − 1))) → ${f(row.generated)} %`;
    if(row.type==='hp') return row.u<=0 ? '0' : row.u===1 ? 'Premier point : 10 HP' : `10 + 390 × (1 − exp(−0,02 × (${f(row.u)} − 1))) → ${f(n)} HP`;
    if(row.type==='regen') return `${f(snapshot.results.HP.total)} HP × (${f(row.u)} × 5 / 150) % → ${f(n)} HP ; base active : ${row.common} HP`;
    if(row.type==='preparation') return row.u<=0 ? '0 %' : row.u===1 ? 'Premier point : 1,5 %' : `1,5 + 33,5 × (1 − exp(−${f(row.u)} / 70)) → ${f(n)} %`;
    if(row.type==='projectile') return `(1 / (1 − min(${f(row.attributeGain)}, 95) / 100) − 1) × 100 → ${f(row.generated)} %`;
    if(row.type==='precision') return row.u<=0 ? '0 %' : row.u===1 ? 'Premier point : 5 %' : `5 + 75 × (1 − exp(−0,025 × (${f(row.u)} − 1))) → ${f(n)} %`;
    if(row.type==='critical') return `${f(row.u)} × 0,5 → ${f(n)} %`;

  }
  function detailHTML(row,snapshot) {
    if(snapshot.mode==='current')return currentDetailHTML(row,snapshot);
    const unit=row.unit, f=value=>fmt(value,6);
    const nativeLabel=['resistance','dodge','projectile'].includes(row.type) ? 'Conversion de la capacité' : 'Montant natif';
    const lines=[['Points directeurs',`${names[row.source]} : ${f(row.u)} / ${f(state.limit)}${row.attribute ? ` · ${names[row.attribute]} : ${f(row.attributeValue)} / ${f(state.limit)}` : ''}`],
      ['Multiplicateur de l’Umbra',row.u>0 ? `1 + (${f(state.curve.max)} − 1) × ${f(row.u)} / (${f(row.u)} + ${f(state.curve.k)}) = ×${f(row.multiplier)}` : '×1 · aucune Umbra active'],
      ['Don fixe de l’Umbra',`${f(row.u)} × ${f(row.giftRate)} → ${f(row.gift)}${unit}`]];
    if(row.attribute) lines.push(['Coefficient de l’attribut',!row.active ? 'Inactif : ni stat+ ni Umbra.' : row.u>0 ? `${f(row.coefficient/row.multiplier)} × ${f(row.multiplier)} = ${f(row.coefficient)} · imposé par ${names[row.source]}` : `${f(row.coefficient)} · fixe, indépendant du montant de stat+`],
      [`Contribution de ${names[row.attribute]}`,`${f(row.attributeValue)} × ${f(row.coefficient)} = ${f(row.attributeRaw)} → ${f(row.attributeGain)} (arrondi supérieur)`]);
    else lines.push(['Ratio d’attribut',row.type==='regen' ? 'Mécanique native : proportion des HP pilotée uniquement par Vitalité.' : 'Aucun dans cette mécanique.']);
    lines.push([nativeLabel,formula(row,snapshot)],['Capacité calculée',`${f(row.generated)}${unit}`],
      ['Somme',`${f(row.fixed)} fixe + ${f(row.plus)} stat+ + ${f(row.gift)} don fixe + ${f(row.generated)} capacité = ${f(row.uncapped)}${unit}`]);
    if(row.capped)lines.push(['Plafond de l’effet',`${f(row.uncapped)} → ${f(row.total)}${unit} · ${f(row.capLoss)}${unit} au-delà du plafond. Les apports fixes saisis restent conservés.`]);
    lines.push(['Total',`${f(row.total)}${unit}`]);
    return `<div class="detail-title">${row.name}${row.state==='normal'?'':` ${row.state}`} · Concept</div><p class="description">${row.description}</p><dl class="calculation">${lines.map(([label,value])=>`<dt>${label}</dt><dd${label==='Total'?' class="result"':''}>${value}</dd>`).join('')}</dl><div class="notice">La statistique peut être arrondie. Les coefficients affichés sont abrégés ; le calcul conserve leur précision.</div>${progressionHTML(row)}`;
  }
  function currentDetailHTML(row,snapshot) {
    const f=value=>fmt(value,6), lines=[['Points d’Umbra',`${names[row.source]} : ${f(row.u)}`],['Don fixe supplémentaire','0 · absent des JS actuels']];
    if(row.attribute) {
      lines.push(['Coefficient',`${names[row.attribute]} × ${f(row.coefficient)} · coefficient fixe`]);
      if(row.attributeValue!==row.attributeUsed)lines.push(['Attribut retenu',`${f(row.attributeValue)} → ${f(row.attributeUsed)} (barème actuel)`]);

    }

    if(row.capped)lines.push(['Plafond de l’effet',`${f(row.uncapped)} → ${f(row.total)}${row.unit}`]);

    return `<div class="detail-title">${row.name} · Version actuelle</div><p class="description">${row.description}</p><dl class="calculation">${lines.map(([label,value])=>`<dt>${label}</dt><dd${label==='Total'?' class="result"':''}>${value}</dd>`).join('')}</dl><div class="notice">Arrondis et plafonds des JS actuels du projet. Aucun paramètre du concept n’est appliqué.</div>${progressionHTML(row)}`;
  }
  function progressionHTML(row) {

    }

  }
  function entryDetail(item,snapshot) {
    if(item.kind==='attribute') {
      const impacted=Object.values(snapshot.results).filter(row=>row.attribute===item.key && row.active);

    return `<p class="description">${item.kind==='x'?'Capacité déjà comprise dans '+names[row.source]:'Contribution de cette ligne'} : ${fmt(part)}${row.unit}.</p>${detailHTML(row,snapshot)}`;
  }
  function renderStatTotals(snapshot) {

  function render() {
    const snapshot=Lab.calculate(state);
    $('#mode-name').textContent=isConcept()?'Concept':'Version actuelle';
    $('#mode-toggle').setAttribute('aria-pressed',String(!isConcept()));
    $('#mode-toggle').setAttribute('aria-label',isConcept()?'Passer à la version actuelle':'Passer au concept');
    $('#limit').title='Limite appliquée au calcul Concept ; les points saisis sont conservés dans les deux modes.';
    for(const [id,value] of [['level',state.level],['limit',state.limit],['curve-k',state.curve.k],['curve-max',state.curve.max]]) {
      if(document.activeElement!==$(`#${id}`))$(`#${id}`).value=value;
    }
    for(const input of root.querySelectorAll('input[data-group]')) {
      const {group,key}=input.dataset; if(document.activeElement!==input)input.value=state[group][key]||0;
    }
    for(const button of root.querySelectorAll('button[data-delta]')) {
      const {group,key,delta}=button.dataset, value=state[group][key]||0;
      button.disabled=Number(delta)<0 && value<=0;
    }
    $('#empty').hidden=selected.size>0; $('#effects-table').hidden=selected.size===0;
    for(const button of root.querySelectorAll('[data-add]'))button.querySelector('small').textContent=selected.has(button.dataset.add)?'Ajouté':'';
    renderStatTotals(snapshot);
    for(const item of selected.values()) {
      const tr=$(`[data-entry="${item.id}"]`), title=tr.querySelector('.effect-name');
      title.setAttribute('aria-expanded',String(open.has(item.id)));
      const ratio=tr.querySelector('.ratio'), total=tr.querySelector('.total');
      if(item.kind==='attribute') {
        ratio.textContent=isConcept()?`Limite : ${fmt(state.limit)}`:'Plafonds propres à chaque effet'; total.textContent=fmt(snapshot.attributes[item.key]);
      } else if(item.kind==='umbra') {
        const u=snapshot.umbras[item.key];
        ratio.innerHTML=isConcept()?`M(U) = ×${fmt(Lab.multiplier(u,state.curve),4)}<small>${fmt(u)} / ${fmt(state.limit)} points retenus</small>`:'Ratios des JS actuels<small>Sans multiplicateur global</small>';
        total.innerHTML=Object.values(snapshot.results).filter(row=>row.source===item.key).map(row=>`<span data-contribution-stat="${row.key}">${fmt(Lab.contributions(row,snapshot.mode).umbra)}${row.unit}<small>${row.name}</small></span>`).join('');
      } else {
        const row=snapshot.results[item.key];
        const coefficient=row.attribute ? `${names[row.attribute]} × ${fmt(row.coefficient,4)}` : row.type==='regen' ? `HP × ${fmt(row.nativeRatio*100,4)} %` : 'Montant calculé';
        if(item.kind==='fixed')ratio.textContent=`+${fmt(row.fixed)}${row.unit} directs`;
        if(item.kind==='plus')ratio.innerHTML=`+${fmt(row.plus)}${row.unit} directs<small>${row.active?`${coefficient}${row.u>0?` · imposé par ${names[row.source]}`:''}`:'Capacité inactive'}</small>`;
        if(item.kind==='x')ratio.innerHTML=row.u>0 && row.active?`Capacité : ${fmt(row.generated)}${row.unit}<small>${coefficient} · ${names[row.source]}</small>`:!isConcept() && row.type==='critical'?'Inactive · nécessite Dégâts critiques +':`Inactive · nécessite ${names[row.source]}`;
        if(!isConcept() && !row.supportsDirect && item.kind!=='x')ratio.textContent='Aucun apport direct équivalent dans les JS actuels';
        const parts=Lab.contributions(row,snapshot.mode);
        total.textContent=`${fmt(parts[item.kind])}${row.unit}`;
        if(item.kind==='x') { const note=document.createElement('small'); note.textContent=`Déjà compris dans ${names[row.source]}`; total.append(note); }
        total.title=row.capped?`Part retenue après le plafond de ${row.cap}${row.unit}`:'';
      }
      const detail=$(`#detail-${item.id}`); detail.hidden=!open.has(item.id);
      if(open.has(item.id)) {
        const expanded=[...detail.querySelectorAll('[data-detail-panel][open]')].map(panel=>panel.dataset.detailPanel);
        detail.firstElementChild.innerHTML=entryDetail(item,snapshot);
        for(const panel of detail.querySelectorAll('[data-detail-panel]'))panel.open=expanded.includes(panel.dataset.detailPanel);
      }
    }
  }
  root.addEventListener('input',event=>{
    const input=event.target;
    if(input.matches('.entity-name')) { root.setAttribute('aria-label',input.value.trim()||`Entité ${serial}`); return; }
    if(input.matches('.picker input')) { filterPicker(input.closest('.picker')); return; }
    if(!input.matches('input[type=number]'))return;
    if(input.value==='' || input.validity.badInput)return;
    const value=readNumber(input);
    if(input.dataset.group) {
      const {group,key}=input.dataset;
      state[group][key]=value;
      if(state[group][key]!==Number(input.value))input.value=state[group][key];
    } else if(input.dataset.ui==='limit') {
      state.limit=value;
      $('#status').textContent='Limite du calcul Concept modifiée. Toutes les saisies sont conservées.';
    } else if(input.dataset.ui==='level')state.level=Math.max(1,Math.floor(value));
    else if(input.dataset.ui==='curve-k')state.curve.k=Math.max(.01,value);
    else if(input.dataset.ui==='curve-max')state.curve.max=Math.max(1,value);
    render();
  });
  root.addEventListener('change',event=>{
    const input=event.target;
    if(!input.matches('input[type=number]'))return;
    if(input.dataset.group) {
      const {group,key}=input.dataset;
      if(input.value==='')state[group][key]=0;
      input.value=state[group][key]||0;
    } else input.value=({'level':state.level,'limit':state.limit,'curve-k':state.curve.k,'curve-max':state.curve.max})[input.dataset.ui];
    render();
  });
  root.addEventListener('click',event=>{
    const button=event.target.closest('button'); if(!button)return;
    if(button.dataset.ui==='mode-toggle') {
      state.mode=isConcept()?'current':'concept'; render();
      $('#status').textContent=`Calculs : ${isConcept()?'Concept':'Version actuelle'} · saisies conservées.`;
    }
    if(button.dataset.add) {
      const item=entries[button.dataset.add], added=addEntry(item);
      const picker=button.closest('.picker'); picker.open=false; picker.querySelector('input').value=''; filterPicker(picker); render();
      const row=$(`[data-entry="${item.id}"]`); (row.querySelector('input')||row.querySelector('.effect-name')).focus({preventScroll:true}); row.scrollIntoView({block:'nearest'});
      $('#status').textContent=added?`${item.name} ajouté au tableau.`:`${item.name} est déjà dans le tableau.`;
    }
    if(button.dataset.delta){const {group,key,delta}=button.dataset;state[group][key]=Math.max(0,Number(((state[group][key]||0)+Number(delta)).toFixed(8)));render();}
    if(button.dataset.detail){const key=button.dataset.detail;if(open.has(key))open.delete(key);else open.add(key);render();}
    if(button.dataset.remove) {
      const item=selected.get(button.dataset.remove); if(!item)return;
      if(item.group)state[item.group][item.key]=0;
      selected.delete(item.id); open.delete(item.id);
      $(`[data-entry="${item.id}"]`).remove(); $(`#detail-${item.id}`).remove(); render();
      $(`[data-catalog="${item.category}"]>summary`).focus(); $('#status').textContent=`${item.name} retiré du tableau.`;
    }
    if(button.dataset.ui==='example' || button.dataset.ui==='clear') {
      state={...Lab.initialState(button.dataset.ui==='example'),mode:state.mode}; open.clear(); selected.clear(); $('#effects').replaceChildren();
      if(button.dataset.ui==='example')for(const id of ['attribute-strength','fixed-physicalDamage','plus-physicalDamage','umbra-vigueur','x-physicalDamage'])addEntry(entries[id],false);
      for(const picker of root.querySelectorAll('.picker')){picker.open=false;picker.querySelector('input').value='';filterPicker(picker);}
      $('#status').textContent=button.dataset.ui==='example'?'Exemple : niveau 51, Force 60, Vigueur 15.':'Tableau vidé.'; render();
    }
  });
  root.addEventListener('keydown',event=>{
    const picker=event.target.closest('.picker');
    if(event.key==='Escape' && picker){picker.open=false;picker.querySelector('summary').focus();event.preventDefault();}
  });
  render();
  }
  let serial=0;
  const entities=document.getElementById('entities'), template=document.getElementById('entity-template');
  function addEntity(focus=false) {
    const root=template.content.firstElementChild.cloneNode(true); root.dataset.entityId=`entity-${++serial}`;
    entities.append(root); mountEntity(root,serial); document.getElementById('no-entities').hidden=true;
    if(focus) { const name=root.querySelector('.entity-name'); name.focus(); name.select(); }
  }
  document.getElementById('add-entity').addEventListener('click',()=>addEntity(true));
  document.addEventListener('click',event=>{
    for(const picker of document.querySelectorAll('.picker'))if(!picker.contains(event.target))picker.open=false;
    const remove=event.target.closest('[data-remove-entity]');
    if(remove) { remove.closest('.entity').remove(); document.getElementById('no-entities').hidden=entities.children.length>0; document.getElementById('add-entity').focus(); }
  });
  addEntity();
})();
</script>
</body>
</html>
