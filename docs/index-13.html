<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atelier de statistiques · Index 13</title>
<style>
html:has(body.stat-lab) { width: auto; height: auto; min-height: 100%; overflow: auto; background: #0c0e10; color-scheme: dark; }
body.stat-lab { display: block; width: auto; height: auto; min-height: 100dvh; margin: 0; padding: 0; overflow: auto; background: #0c0e10; color: #e6e8e9; font: 14px/1.45 Georgia, 'Times New Roman', serif; }
.stat-lab *, .stat-lab *::before, .stat-lab *::after { box-sizing: border-box; letter-spacing: 0; }
.stat-lab [hidden] { display: none !important; }
.lab-app { width: 100%; margin: 0; padding: 18px 20px; }
.lab-app h1, .lab-app h2, .lab-app h3, .lab-app p { margin: 0; padding: 0; font-weight: normal; }
.lab-topbar, .lab-heading, .lab-tools, .lab-toolbar, .lab-column-header { display: flex; align-items: center; gap: 12px; }
.lab-topbar { justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid #363a3f; }
.lab-heading h1 { font-size: 23px; color: #eceef0; }
.lab-heading h1 small { padding-left: 8px; color: #99a1aa; font: 13px system-ui, sans-serif; }
.lab-mode, .lab-level, .lab-toolbar, .lab-count, .lab-tabs, .lab-unit, .lab-source-kind, .lab-empty, .lab-requirement { font-family: system-ui, sans-serif; font-size: 12px; }
.lab-mode { color: #a7ccba; white-space: nowrap; }
.lab-level { display: flex; align-items: center; gap: 8px; color: #aab2bb; }
.stat-lab input, .stat-lab button { font: inherit; margin: 0; border-radius: 3px; box-shadow: none; text-shadow: none; }
.stat-lab input { min-width: 0; height: 32px; padding: 4px 6px; border: 1px solid #454a50; background: #171a1e; color: #f0f1f2; font: 13px/1.2 system-ui, sans-serif; }
.stat-lab input[type=number] { width: 72px; font-variant-numeric: tabular-nums; }
.stat-lab input:focus-visible, .stat-lab button:focus-visible { outline: 2px solid #d8c78c; outline-offset: 2px; }
.stat-lab button { position: static; transform: none; background: transparent; border: 1px solid #454a50; cursor: pointer; font-weight: normal; }
.stat-lab button:hover { background: #282c31; border-color: #a6acb4; }
.stat-lab button:disabled { cursor: not-allowed; opacity: .4; }
.lab-icon-button, .lab-add, .lab-remove { flex: 0 0 30px; width: 30px; height: 32px; padding: 0; display: inline-grid; place-items: center; color: #e0e4e8; font: 22px/1 system-ui, sans-serif !important; }
.lab-icon-button img { width: 19px; height: 19px; }
.lab-toolbar { justify-content: space-between; margin: 12px 0 16px; }
.lab-toolbar input { width: 430px; max-width: 65%; }
#lab-status { color: #aab2bb; text-align: right; }
#lab-status[data-error=true] { color: #ff9991; }
.lab-columns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.2fr); align-items: start; }
.lab-column { min-width: 0; padding: 0 12px; border-left: 1px solid #32363b; }
.lab-column:first-child { border-left: 0; padding-left: 0; }
.lab-column:last-child { padding-right: 0; }
.lab-column-header { min-height: 45px; justify-content: space-between; border-bottom: 1px solid #464a51; }
.lab-column-header h2 { font-size: 17px; color: #e0e4e8; }
.lab-count { color: #9ca4ae; font-variant-numeric: tabular-nums; }
.lab-catalog { overflow-y: auto; max-height: calc(100dvh - 177px); scrollbar-width: thin; scrollbar-color: #484d53 #141619; overscroll-behavior: contain; padding-right: 4px; }
.lab-group-title { padding: 15px 0 6px !important; color: #a9b0b8; font: 11px/1.3 system-ui, sans-serif !important; text-transform: uppercase; }
.lab-row { display: grid; grid-template-columns: 27px minmax(0, 1fr) 64px 30px 28px; gap: 5px; align-items: center; min-height: 52px; padding: 8px 0; border-bottom: 1px solid #25292e; }
.lab-row > input[type=number] { width: 100%; }
.lab-row > .lab-add { width: 28px; height: 30px; }
.stat-lab .picto-stat { display: inline-block; position: static; flex: 0 0 27px; width: 27px; height: 27px; min-width: 27px; margin: 0; padding: 0; transform: none; vertical-align: middle; background-size: contain; background-repeat: no-repeat; background-position: center; }
.stat-lab .lab-name { padding: 0; border: 0; border-radius: 0; text-align: left; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
.lab-name:hover { background: transparent !important; text-decoration: underline dotted; text-underline-offset: 3px; }
.lab-unit { color: #abb2bc; font-size: 11px; text-align: center; overflow-wrap: anywhere; }
.stat-lab .lab-name.stat-name { padding: 0; margin: 0; }
.lab-requirement { grid-column: 2 / -1; color: #a4aab1; font-size: 10px; margin-top: -2px; }
.lab-row[data-available=false] .lab-name, .lab-row[data-available=false] > .picto-stat { opacity: .55; }
.lab-row[data-kind=umbra] .lab-name { color: #dce1e6; }
.lab-tabs { display: flex; margin: 10px 0; border-bottom: 1px solid #3b4046; }
.lab-tabs button { min-height: 34px; padding: 6px 12px; border: 0; border-radius: 0; color: #aab1bb; }
.lab-tabs button[aria-selected=true] { border-bottom: 2px solid #d6bf72; color: #f3e1ac; }
.lab-tabs span { margin-left: 5px; font-variant-numeric: tabular-nums; }
.lab-results { overflow-y: auto; max-height: calc(100dvh - 224px); scrollbar-width: thin; overscroll-behavior: contain; }
.lab-active-umbras { padding: 9px 0; border-bottom: 1px solid #353a40; }
.lab-active-umbras summary { cursor: pointer; color: #abb8c6; font: 12px/1.5 system-ui, sans-serif; }
.lab-active-umbras summary:focus-visible { outline: 2px solid #d8c78c; outline-offset: 2px; }
.lab-empty { padding: 28px 8px !important; color: #a4abb4; text-align: center; }
.lab-result { display: grid; grid-template-columns: 27px minmax(0, 1fr) auto 28px; gap: 8px; align-items: center; min-height: 47px; padding: 9px 0; border-bottom: 1px solid #292d32; }
.lab-result > .lab-remove { width: 28px; height: 30px; }
.lab-result-value { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 15px; }
.lab-result-value small { margin-left: 3px; font-size: 11px; }
.lab-result-sources { grid-column: 2 / -1; font: italic 11px/1.4 system-ui, sans-serif; color: #dda65f; }
.lab-source { display: grid; grid-template-columns: 26px minmax(0,1fr) 65px 30px 26px; align-items: center; gap: 6px; padding: 10px 0; border-bottom: 1px solid #292d32; }
.lab-source input { width: 100% !important; }
.lab-source-kind { display: block; color: #9ca6af; font-size: 10px; margin-top: 3px; }
.lab-source .lab-remove { width: 26px; height: 28px; border: 0; color: #bca3a3; }
.stat-lab .lab-helper { position: fixed; z-index: 1000; width: max-content; max-width: min(610px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 14px 17px; margin: 0; overflow: auto; background: #090a0bf5; border: 1px solid #75684b; border-radius: 4px; box-shadow: 0 8px 30px #0009; font: 14px/1.6 Georgia, 'Times New Roman', serif; color: #f1f1ed; opacity: 1; transition: none; pointer-events: auto; text-align: left; white-space: normal; }
.stat-lab .lab-helper .stat-hover-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #d7c692; font-size: 15px; }
.stat-lab .lab-helper .stat-hover-body { margin: 10px 0; overflow-wrap: anywhere; }
.stat-lab .lab-helper .stat-hover-footer { font-size: 12px; color: #dda65f; font-style: italic; }
.stat-lab .lab-helper .separation-line { display: block; width: 100%; height: 1px; margin: 9px 0; background: #655a3e; }
.stat-lab .lab-helper .picto-stat { width: 24px; height: 24px; min-width: 24px; }
.lab-helper .helper-figure { display: inline-flex; align-items: center; white-space: nowrap; gap: 3px; }
.lab-helper [data-umbra-part] { border-bottom: 1px dotted #72777d; cursor: help; }
.lab-helper .lab-detail { display: block; margin: 12px 0 0; padding-top: 8px; border-top: 1px solid #44403a; }
.lab-helper .lab-detail:empty { display: none; }
@media (max-width: 1250px) {
  .lab-columns { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 0; }
  .lab-column:nth-child(3) { padding-left: 0; border-left: 0; }
  .lab-catalog, .lab-results { max-height: 520px; }
}
@media (max-width: 620px) {
  .lab-app { padding: 12px; }
  .lab-topbar { align-items: start; flex-direction: column; gap: 10px; }
  .lab-heading h1 { font-size: 20px; }
  .lab-tools { width: 100%; justify-content: space-between; }
  .lab-toolbar { align-items: stretch; flex-direction: column; gap: 7px; }
  .lab-toolbar input { max-width: 100%; width: 100%; }
  #lab-status { text-align: left; }
  .lab-columns { grid-template-columns: minmax(0, 1fr); }
  .lab-column { padding: 0; border: 0; }
  .lab-catalog, .lab-results { max-height: 390px; }
  .lab-result-column { grid-row: 1; }
  .lab-row { grid-template-columns: 27px minmax(0, 1fr) 72px 30px 28px; }
}

// calculateVitalityBonus (js/entites.js)
function rule0(vitality) {
  if (vitality <= 0) return 0;
  const cfg = rule1.generatedStats.vitalityHp;
  if (vitality === 1) return cfg.firstPointBonus;

  const min = cfg.minBonus;
  const max = cfg.maxBonus;
  const k = cfg.growthK;

  const bonus = min + (max - min) * (1 - Math.exp(-k * (vitality - 1)));
  return Math.min(Math.ceil(bonus), max);
}

// roundBalance (js/data/balanceData.js)
function rule3(value, decimals = 0) {
  const n = Number(value) || 0;
  const factor = 10 ** Math.max(0, Number(decimals) || 0);
  const rounded = Math.round(n * factor) / factor;
  return Object.is(rounded, -0) ? 0 : rounded;
}

// calculateCritChancePercent (js/entites.js)
function rule2(critValue) {
  const cfg = rule1.critical.chanceCurve;
  const maxCrit = cfg.maxStat;
  const steepness = cfg.steepness;
  const midpoint = cfg.midpoint;

  // Formule logistique
  const ratio = 1 / (1 + Math.exp(-steepness * (critValue - midpoint)));

  // Normalisation (0 → 0, 150 → 1)
  const minVal = 1 / (1 + Math.exp(-steepness * (0 - midpoint)));
  const maxVal = 1 / (1 + Math.exp(-steepness * (maxCrit - midpoint)));
  const normalized = (ratio - minVal) / (maxVal - minVal);

  // Conversion en pourcentage
  const critChance = normalized * cfg.maxPercent;

  return rule3(critChance, cfg.decimals);
}

// calculateDodgePercent (js/entites.js)

  if (points <= 0) return 0;
  const cfg = rule1.baseUmbraCurves.dodge;

  const min = cfg.minPercent;

  return Math.min(Number(percent.toFixed(cfg.decimals)), max);
}

  const min = cfg.minPercent;

function getSafe(entity, path, fallback = 0) { const keys = String(path).replace(/^stats\./, '').split('.'); let value = entity?.stats; for (const key of keys) value = value?.[key]; return value ?? fallback; }

// calculateEsoterismPercent (js/entites.js)
function rule10(entite, pointsOverride) {
  if (!entite) return 0;
  const cfg = rule1.baseUmbraCurves.esoterism;

  const points =
    Number(pointsOverride ?? getSafe(entite, "esoterism") ?? getSafe(entite, "stats.esoterism")) || 0;

  if (points <= 0) return 0;
  if (points === 1) return cfg.firstPointPercent;

  const min = cfg.minPercent;
  const max = cfg.maxPercent;
  const basePercent = min + (max - min) * Math.sqrt((points - 1) / cfg.divisor);

  return Math.min(Math.round(basePercent), max);
}

// calculateResiliencePercent (js/entites.js)
function rule12(resiValue) {
  const v = Math.max(0, resiValue);
  const cfg = rule1.resilience.critReductionCurve;

  if (v <= cfg.earlyLinearUntil) return Math.round(v);

  const maxResi = cfg.maxStat;
  if (v >= maxResi) return cfg.maxPercent;

  const t = (v - cfg.earlyLinearUntil) / (maxResi - cfg.earlyLinearUntil);
  const inv = 1 - t;

  const k = cfg.curveK;

  const f = t / (t + k * inv * inv);

  const percent = cfg.earlyLinearUntil + (cfg.maxPercent - cfg.earlyLinearUntil) * f;
  return Math.round(percent);
}

// calculateTranscendenceExtraLife (js/entites.js)
function rule13(points) {
  const p = Math.max(0, Number(points) || 0);
  if (p === 0) return 0;
  const cfg = rule1.generatedStats.transcendenceExtraLife;
  const CAP = cfg.capPoints;
  const MAX = cfg.maxExtraLife;
  const EXP = cfg.exponent;
  if (p >= CAP) return MAX;
  const raw = MAX * Math.pow(p / CAP, EXP); // 0.. < 7
  let value = Math.round(raw);
  // Forcer 1 dès que p > 0
  value = Math.max(1, value);
  // Réserver 7 à 150+
  if (value >= MAX) value = MAX - 1;
  return value;
}

// calculateWeaponMasteryCharge (js/entites.js)
function rule14(entite, value) {
  const cfg = rule1.weaponMastery.charge;
  const sourceValue =
    value ??
    (typeof entite === "number" ? entite : getSafe(entite, "weaponMastery", 0));

  const weaponMastery = Math.max(
    0,
    Math.floor(Number(sourceValue) || 0)
  );

  if (weaponMastery <= 0) return 0;

  return Math.floor(weaponMastery / cfg.masteryDivisor) + cfg.masteryBaseBonus;
}

// toNumber (js/items/armor.js)
function rule16(value, fallback = 0) {
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

// calculateRobustnessArmorDetails (js/items/armor.js)
function rule15(robustness, strength = 0) {
  const cfg = rule1.generatedStats.robustnessArmor;
  const points = Math.max(0, rule16(robustness));
  const force = Math.max(0, rule16(strength));
  const strengthCurveMax = Math.max(0, Math.floor(rule16(cfg.strengthCurveMax)));
  const strengthOffset = Math.max(0, rule16(cfg.strengthOffset));
  const strengthScale = Math.max(Number.EPSILON, rule16(cfg.strengthScale));
  const baseBonus = points > 0 ? Math.min(strengthCurveMax, Math.max(0, rule16(cfg.baseBonus))) : 0;
  const scaledForce = force / strengthScale;
  const scaledOffset = strengthOffset / strengthScale;
  // Expanded cubic difference avoids cancellation at low Force and infinity minus infinity.
  const progression = force > 0
    ? scaledForce * (scaledForce ** 2 + 3 * scaledForce * scaledOffset + 3 * scaledOffset ** 2)
    : 0;
  const rawStrengthCurve = points > 0
    ? baseBonus - (strengthCurveMax - baseBonus) * Math.expm1(-progression)
    : 0;
  const strengthCurve = Math.min(strengthCurveMax, Math.ceil(rawStrengthCurve));
  const robustnessBonus = Math.ceil(points);

  return {
    armor: Math.min(Number.MAX_VALUE, robustnessBonus + strengthCurve),
    baseBonus,
    robustness: points,
    robustnessBonus,
    strength: force,
    strengthBonus: strengthCurve - baseBonus,
    strengthCurve,
    rawStrengthCurve,
    strengthCurveMax,
    strengthOffset,
    strengthScale,
  };
}

// calculateHypercognitionRatio (js/damagesCalcul.js)
function rule17(value, config = {}) {
  const { maxValue = 150, maxOutput = 3, midpoint = 50, steepness = 0.045 } = config;
  const logistic = x => 1 / (1 + Math.exp(-steepness * (x - midpoint)));
  const min = logistic(0);
  const max = logistic(maxValue);
  const normalized = (logistic(value) - min) / (max - min);
  const atOne = (logistic(1) - min) / (max - min) * maxOutput;
  const output = 0.5 + (normalized * maxOutput - atOne) * (maxOutput - 0.5) / (maxOutput - atOne);
  return Number(Math.min(Math.max(output, 0), maxOutput).toFixed(2));
}

// calculateVitalityRegenPercent (js/damagesCalcul.js)
function rule18(vitality, config = {}) {
  const { maxVitality, maxPercent, decimals } = {
    ...rule1.regeneration.vitalityDayHp,
    ...config,
  };

  const v = Math.max(0, rule19(vitality, 0));
  const clamped = Math.min(v, maxVitality);

  const percent = (clamped / maxVitality) * maxPercent; // linéaire
  return parseFloat(percent.toFixed(decimals));
}

// calculateVitalityRegenAmount (js/damagesCalcul.js)
function rule20(maxHP, regenPercent) {
  const hp = Math.max(0, rule19(maxHP, 0));
  const p  = Math.max(0, rule19(regenPercent, 0));

  // Bonus vitalité = 0 si pas de HP exploitable ou pas de %
  if (hp === 0 || p === 0) return 0;

  const raw = hp * (p / 100);

  // Arrondi au plus proche (0.5 -> supérieur), toujours entier >= 0
  return Math.max(0, Math.round(raw));
}

// calculateHpBattleRegenIndestructibilityRatio (js/damagesCalcul.js)
function rule21(entite) {
  if (!entite) return 0;
  const cfg = rule1.regeneration.battleHp;
  const indestructibility = Math.max(0, Number(getSafe(entite, "indestructibility")) || 0);
  if (indestructibility <= 0) return 0;

  const cappedIndestructibility = Math.min(indestructibility, cfg.indestructibilityCap);
  const span = Math.max(1, cfg.indestructibilityCap - 1);
  const ratio = cfg.indestructibilityMinPercent +
    ((cappedIndestructibility - 1) / span) *
    (cfg.indestructibilityMaxPercent - cfg.indestructibilityMinPercent);
  return Math.max(
    cfg.indestructibilityMinPercent,
    Math.min(cfg.indestructibilityMaxPercent, Math.round(ratio))
  );
}

// calculateHpBattleRegenStrengthRatio (js/damagesCalcul.js)

  // l'entité possède Indestructibilité.
  if (indestructibility <= 0) return 0;

  const strength = Math.max(0, Number(getSafe(entite, "strength")) || 0);
  if (strength <= 0) return 0;

  const cappedStrength = Math.min(strength, cfg.strengthCap);
  const ratio = (cappedStrength / cfg.strengthCap) * cfg.strengthMaxPercent;
  return Math.max(0, Math.min(cfg.strengthMaxPercent, Math.round(ratio)));
}

// calculateResilienceAlterationBonus (js/damagesCalcul.js)
function rule40(entite) {
  const cfg = rule1.resilience.alteration;
  const resilience = Number(getSafe(entite, "resilience")) || 0;
  if (resilience <= 1) return cfg.minVisiblePercent;

  const maxResi = cfg.maxResilience;

  const minBonus = cfg.minVisiblePercent;
  const maxBonus = cfg.maxBonusPercent;

  const softCapResi = cfg.softCapResilience;
  const softCapBonus = cfg.softCapBonusPercent;
  const r = Math.min(resilience, maxResi);

  let bonus;

  if (r <= softCapResi) {
    // Phase 1: linéaire (monte fort)
    const t = r / softCapResi; // 0..1
    bonus = minBonus + t * (softCapBonus - minBonus);
  } else {
    // Phase 2: rendements décroissants (ease-out)
    const u = (r - softCapResi) / (maxResi - softCapResi); // 0..1
    const easeOut = u * (2 - u); // 0..1
    bonus = softCapBonus + easeOut * (maxBonus - softCapBonus);
  }

  return rule3(bonus, cfg.decimals);
}

// calculateResilienceCancelBonus (js/damagesCalcul.js)

  const minBonus = cfg.minBonusPercent;
  const maxBonus = cfg.maxBonusPercent;
  const softCapResi = cfg.softCapResilience;
  const softCapBonus = cfg.softCapBonusPercent;

  const r = Math.min(resilience, maxResi);

  let bonus;
  if (r <= softCapResi) {
    const t = r / softCapResi; // 0..1
    bonus = minBonus + t * (softCapBonus - minBonus);
  } else {
    const u = (r - softCapResi) / (maxResi - softCapResi); // 0..1
    const easeOut = u * (2 - u); // 0..1
    bonus = softCapBonus + easeOut * (maxBonus - softCapBonus);
  }

  return rule3(bonus, cfg.decimals);
}

// easeOutPowerRatio (js/data/balanceData.js)
function rule45(value, cap, curvePower = 2) {

  const ratio = cap > 0 ? capped / cap : 0;
  return 1 - Math.pow(1 - ratio, curvePower);
}

// trunc2 (js/damagesCalcul.js)

// transcendenceConsoProtection (js/damagesCalcul.js)
function rule49(entiteOrValue, config = {}) {
  const cfg = {
    ...rule1.transcendence.consoProtection,
    ...config,
  };
  const {
    refTranscendence,
    refPercent,
    maxPercent,
  } = cfg;

  const t =
    typeof entiteOrValue === "number"
      ? entiteOrValue
      : (getSafe(entiteOrValue, "stats.transcendence", null) ??
         getSafe(entiteOrValue, "transcendence", 0));

  const transcendence = Math.max(0, rule19(t, 0));
  const rawPercent = (transcendence / Math.max(1, refTranscendence)) * refPercent;
  const capped = Math.min(rawPercent, maxPercent);

  return rule50(capped);
}

  if (maxCharges <= 0) {
    return {
      totalCurrent: 0,
      basePercent: 0,
      agiRatioCurrent: 0,
    };

  const agility = rule66(entite);

  const basePercent = cfg.baseStartingPercent;
  const maxAgilityBonusPercent = cfg.maxAgilityStartingBonusPercent;

  return {
    totalCurrent: Math.round(totalCurrent),
    basePercent,
    agiRatioCurrent: Math.round(agiRatioCurrent),

  ['mysticism', 'preparation', 'Bonus de préparation mystique', 'calculateMysticismBasePreparationAcceleration', 'intelligence', 'calculateMysticismIntelPreparationAcceleration'],
  ['mysticism', 'damage', 'Bonus de dégâts mystiques', 'calculateMysticismBaseDamageBonus', 'intelligence', 'calculateMysticismIntelDamageBonus'],
  ['equilibre', 'aggro', "Réduction d'aggro", 'calculateEquilibreBaseAggroReduction', 'intelligence', 'calculateEquilibreIntelAggroReduction'],
  ['equilibre', 'detection', 'Détection des cibles invisibles', 'calculateEquilibreBaseInvisibleDetection', 'agility', 'calculateEquilibreAgiInvisibleDetection'],
  ['equilibre', 'chance', 'Attaque équilibrée', 'calculateEquilibreBaseBalancedAttackChance', 'intelligence', 'calculateEquilibreIntelBalancedAttackChance'],
  ['occultism', 'invisibility', "Chance d'invisibilité", 'calculateOccultismBaseInvisibilityChance', 'agility', 'calculateOccultismAgiInvisibilityChance'],
  ['occultism', 'targetable', "Chance d'être pris pour cible", 'calculateOccultismBaseTargetableChance', 'agility', 'calculateOccultismAgiTargetableChance'],
  ['occultism', 'dodge', "Esquive pendant l'invisibilité", 'calculateOccultismBaseDodgeBonus', 'agility', 'calculateOccultismAgiDodgeBonus', 'pts'],
]) effect(origin, key, name, v => native[baseFn](v) / (divisor || 1), [], { unit: unit || '%', icon: origin === 'mysticism' ? 'mysticism mysticTrance' : origin,
  bonus: ctx => [term(attribute, native[bonusFn](ctx.view) / (divisor || 1), `${figure(attribute, ctx.read(attribute))} → ${figure(origin, native[bonusFn](ctx.view) / (divisor || 1), unit || '%')}`)] });
effect('occultism', 'critical', 'Critique à la sortie des ombres', () => 0, [['agility', 'calculateOccultismAgiCritChanceBonus']]);
effect('occultism', 'fragility', 'Fragilité des ombres', () => B.occultism.drawbacks.shadowFragilityPercent);
effect('occultism', 'discretion', 'Discrétion', () => B.occultism.drawbacks.preparationSpeedDebuffPercent);

function calculateLab(input, level = 1) {
  const selected = input.map(entry => {
    const spec = CATALOGS[entry.kind]?.find(spec => spec.key === entry.key);
    if (!spec || !Number.isFinite(entry.value) || entry.value < 0 || entry.value > 1e9 || spec.step === 1 && !Number.isInteger(entry.value)) throw new Error('Valeur de source invalide.');
    return { ...entry };
  });
  const sums = { normal: {}, improved: {}, umbra: {} };
  for (const entry of selected) sums[entry.kind][entry.key] = (sums[entry.kind][entry.key] || 0) + entry.value;
  const result = new Map();
  const evaluating = new Set();
  function evaluate(key) {
    if (result.has(key)) return result.get(key);
    if (evaluating.has(key)) throw new Error(`Dépendance circulaire : ${key}`);
    evaluating.add(key);
    const rule = formulaRules.get(key) || {};
    const spec = specs.get(key) || rule;
    const origin = rule.origin;
    const normal = sums.normal[key] || 0;
    const plus = sums.improved[key] || 0;
    const umbra = sums.umbra[origin] || 0;
    const hasNormal = Object.hasOwn(sums.normal, key);
    const hasPlus = Object.hasOwn(sums.improved, key) || umbra > 0;
    const active = plus > 0 || umbra > 0;
    const context = { key, unit: spec.unit || '%', normal, plus, umbra,
      view: { stats: { ...sums.normal, ...sums.umbra } },
      read: name => Object.hasOwn(sums.umbra, name) ? sums.umbra[name] : evaluate(name).value };
    for (const attribute of attributeKeys) context.view.stats[attribute] = sums.normal[attribute] || 0;
    const base = active && rule.base ? rule.base(context) : 0;
    const fixed = active ? rule.fixed || 0 : 0;
    const bonuses = active && rule.bonus ? rule.bonus(context) : [];
    const before = plus + base + fixed + bonuses.reduce((sum, contribution) => sum + contribution.value, 0);
    const enhanced = active ? clampValue((rule.finish || round)(before), rule.max) : 0;
    const uncapped = normal + enhanced;
    const value = round(clampValue(uncapped, rule.max));
    const normalApplied = round(Math.max(0, value - enhanced));
    if (!Number.isFinite(value)) throw new Error(`Résultat invalide : ${spec.name || key}`);
    const state = hasNormal && hasPlus ? 'X' : hasPlus ? '+' : 'normal';
    const parts = [];
    const relevant = kind => selected.filter(entry => entry.key === key && entry.kind === kind);
    const sumHTML = (items, unit) => items.map(entry => figure(key, entry.value, unit)).join(' + ') || figure(key, 0, unit);
    if (hasNormal) parts.push(term(key, normalApplied, `${sumHTML(relevant('normal'), spec.unit)} ${normalApplied < normal ? '→' : '='} ${figure(key, normalApplied, spec.unit)}${normalApplied < normal ? ' · Max atteint.' : ''}`));
    if (hasPlus) {
      const terms = [];
      if (Object.hasOwn(sums.improved, key)) terms.push(sumHTML(relevant('improved'), rule.inputUnit || spec.unit));
      if (umbra > 0) terms.push(figure(origin, base, rule.inputUnit || spec.unit));
      if (fixed) terms.push(figure('neutral', fixed, rule.inputUnit || spec.unit));
      for (const contribution of bonuses) terms.push(contribution.html);
      const expression = terms.join(' + ') || figure(key, 0);
      parts.push(term(key, enhanced, `${expression} ${rule.inputUnit && conversions[key] ? '→' : '='} ${figure(key, enhanced, spec.unit)}${enhanced < (rule.finish || round)(before) ? ' · Max atteint.' : ''}`));
    }
    const row = { id: key, key: specs.has(key) ? key : origin, name: spec.name || key, icon: spec.icon || key,
      unit: spec.unit || 'pts', value, normal: normalApplied, normalInput: normal, enhanced, state, improved: state !== 'normal',
      maxReached: Number.isFinite(rule.max) && value >= rule.max, uncapped, parts,
      group: specs.has(key) ? spec.group : 'Effets des Umbras', origin: umbra > 0 ? origin : null,
      originName: umbra > 0 ? specs.get(origin)?.name : '', count: relevant('normal').length + relevant('improved').length,
      visible: hasNormal || hasPlus };
    result.set(key, row);
    evaluating.delete(key);
    return row;
  }
  for (const spec of CATALOGS.normal) evaluate(spec.key);
  for (const rule of effectRules) if (sums.umbra[rule.origin] > 0) evaluate(rule.key);
  return { rows: [...result.values()].filter(row => row.visible), entries: selected, level,
    activeUmbras: CATALOGS.umbra.filter(spec => sums.umbra[spec.key] > 0).map(spec => ({ ...spec, value: sums.umbra[spec.key] })),
    available: Object.fromEntries(CATALOGS.improved.map(spec => [spec.key, true])) };
}
let labSnapshot = calculateLab([]);
function labHelper(target, part) {
  const row = labSnapshot.rows.find(row => row.id === target);
  const spec = specs.get(target);
  if (part && row?.parts[part.index]) return { title: 'Détail du calcul', html: row.parts[part.index].html, footer: '' };
  if (row) {
    const pieces = row.parts.map((entry, index) => `<span tabindex="0" data-umbra-part="${index}" data-umbra-calculation="total">${figure(row.icon, entry.value, row.unit)}</span>`);
    return { title: `${row.name}${row.state === 'normal' ? '' : ` ${row.state}`}`,
      html: `${figure(row.icon, row.value, row.unit)}${pieces.length ? ` (${pieces.join(' + ')})` : ''}${row.maxReached ? '<br>Max atteint.' : ''}`,
      footer: [row.originName ? `Umbra : ${row.originName}` : '', row.count ? `${row.count} source${row.count > 1 ? 's' : ''} autonome${row.count > 1 ? 's' : ''}` : ''].filter(Boolean).join(' · ') };
  }
  const effects = labSnapshot.rows.filter(row => row.origin === target);
  return { title: spec?.name || target, html: effects.length ? effects.map(row => `${row.name} : ${figure(row.icon, row.value, row.unit)}`).join('<br>') : figure(spec?.icon || target, 0, spec?.unit), footer: '' };
}
window.statLab = Object.freeze({ calculate: calculateLab, catalogs: CATALOGS });
</script>
<script>
const $ = id => document.getElementById(id);
const status = $('lab-status');
const popup = $('lab-helper');
const format = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 6 });
const entries = [];
const catalogRows = [];
let catalogs;
let snapshot;
let sourceSequence = 0;
let latestCalculation = 0;
let helperSequence = 0;
let hoverTimer;
let helperTarget;
let helperAnchor;
let pinned = false;
let activeTab = 'totals';

function node(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

function icon(key) {
  const element = node('span', `picto-stat ${key}`);
  element.setAttribute('aria-hidden', 'true');
  return element;
}

function setStatus(message, error = false) {
  status.textContent = message;
  status.dataset.error = String(error);
}

function request(type, payload) {
  return Promise.resolve().then(() => {
    if (type === 'calculate') return labSnapshot = calculateLab(payload.entries, payload.level);
    return labHelper(payload.target, payload.part);
  });
}

function inputValue(input, spec) {
  const value = input.valueAsNumber;
  if (input.value.trim() === '' || !Number.isFinite(value) || value < 0 || value > 1e9
    || (spec.step === 1 && !Number.isInteger(value))) {
    input.setCustomValidity(spec.step === 1 ? 'Saisir un nombre entier positif ou nul.' : 'Saisir un nombre positif ou nul.');
    input.reportValidity();
    return null;
  }
  input.setCustomValidity('');
  return value;
}

function makeInput(spec, value, label) {
  const input = node('input');
  input.type = 'number';
  input.min = '0';
  input.max = '1000000000';
  input.step = String(spec.step);
  input.value = String(value);
  input.setAttribute('aria-label', label);
  input.addEventListener('input', () => input.setCustomValidity(''));
  return input;
}

function helperButton(name, target, className = '', improved = false) {
  const button = node('button', `lab-name ${className}`, name);
  if (improved) {
    button.classList.add('stat-name');
    button.replaceChildren(node('span', 'stat-improved-label', name));
  }
  button.type = 'button';
  button.dataset.helperTarget = target;
  button.addEventListener('pointerenter', () => {
    clearTimeout(hoverTimer);
    if (!pinned) hoverTimer = setTimeout(() => showHelper(target, button), 160);
  });
  button.addEventListener('pointerleave', () => {
    clearTimeout(hoverTimer);
    if (!pinned) hoverTimer = setTimeout(closeHelper, 120);
  });
  button.addEventListener('focus', () => { if (!pinned) showHelper(target, button); });
  button.addEventListener('click', event => {
    event.stopPropagation();
    if (pinned && helperTarget === target && helperAnchor === button) closeHelper();
    else { pinned = true; showHelper(target, button); }
  });
  return button;
}

function renderCatalogs() {
  for (const [kind, list] of Object.entries(catalogs)) {
    const container = $(`${kind}-list`);
    let group;
    for (const spec of list) {
      if (spec.group !== group) {
        group = spec.group;
        container.append(node('h3', 'lab-group-title', group));
      }
      const form = node('form', 'lab-row');
      form.dataset.kind = kind;
      form.dataset.key = spec.key;
      const name = `${spec.name}${kind === 'improved' ? ' +' : ''}`;
      const input = makeInput(spec, 1, `${name} : valeur à ajouter`);
      const add = node('button', 'lab-add', '+');
      add.type = 'submit';
      add.title = `Ajouter ${name}`;
      add.setAttribute('aria-label', add.title);
      form.append(icon(spec.icon), helperButton(name, spec.key, spec.icon, kind === 'improved'), input, node('span', 'lab-unit', spec.unit), add);
      let requirement;
      if (kind === 'improved') {
        requirement = node('span', 'lab-requirement');
        form.append(requirement);
      }
      form.addEventListener('submit', event => {
        event.preventDefault();
        if (add.disabled) return;
        const value = inputValue(input, spec);
        if (value === null) return;
        entries.push({ id: String(++sourceSequence), kind, key: spec.key, value });
        recalculate();
      });
      container.append(form);
      catalogRows.push({ form, spec, kind, add, requirement });
    }
    $(`${kind}-count`).textContent = String(list.length);
  }
}

function updateCatalogs() {
  const query = $('lab-search').value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('fr');
  const counts = { normal: 0, improved: 0, umbra: 0 };
  for (const { form, spec, kind, requirement } of catalogRows) {
    const name = `${spec.name} ${spec.key} ${spec.originName}`.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('fr');
    form.hidden = !name.includes(query);
    if (!form.hidden) counts[kind]++;
    if (kind === 'improved') {
      requirement.textContent = `Umbra : ${spec.originName}`;
    }
  }
  for (const kind of Object.keys(catalogs)) {
    $(`${kind}-count`).textContent = query ? `${counts[kind]} / ${catalogs[kind].length}` : String(counts[kind]);
    for (const heading of $(`${kind}-list`).querySelectorAll('.lab-group-title')) {
      let next = heading.nextElementSibling;
      let visible = false;
      while (next && !next.classList.contains('lab-group-title')) { visible ||= !next.hidden; next = next.nextElementSibling; }
      heading.hidden = !visible;
    }
  }
}

function removeResultButton(result) {
  const button = node('button', 'lab-remove', '−');
  button.type = 'button';
  button.title = `Retirer ${result.name} et ses sources${result.originName ? `, dont l'Umbra ${result.originName}` : ''}`;
  button.setAttribute('aria-label', button.title);
  button.addEventListener('click', () => {
    const keys = new Set([result.key, result.origin].filter(Boolean));
    for (let index = entries.length - 1; index >= 0; index--) {
      if (keys.has(entries[index].key)) entries.splice(index, 1);
    }
    recalculate();
  });
  return button;
}

function renderTotals() {
  const container = $('lab-totals');
  container.replaceChildren();
  if (!entries.length) { container.append(node('p', 'lab-empty', 'Aucune source ajoutée.')); return; }
  if (snapshot.activeUmbras.length) {
    const active = node('details', 'lab-active-umbras');
    active.append(node('summary', '', `${snapshot.activeUmbras.length} Umbra${snapshot.activeUmbras.length > 1 ? 's' : ''} active${snapshot.activeUmbras.length > 1 ? 's' : ''}`));
    for (const umbra of snapshot.activeUmbras) {
      const row = node('div', 'lab-result');
      row.dataset.result = `umbra:${umbra.key}`;
      row.append(icon(umbra.icon), helperButton(umbra.name, umbra.key), node('span', `lab-result-value ${umbra.icon}`, `${format.format(umbra.value)} pts`), removeResultButton(umbra));
      active.append(row);
    }
    container.append(active);
  }
  for (const group of ['Attributs', 'Statistiques', 'Effets des Umbras']) {
    const rows = snapshot.rows.filter(row => row.group === group);
    if (!rows.length) continue;
    container.append(node('h3', 'lab-group-title', group));
    for (const result of rows) {
      const row = node('div', 'lab-result');
      row.dataset.result = result.id;
      row.dataset.value = String(result.value);
      row.dataset.state = result.state;
      const value = node('span', `lab-result-value ${result.icon}`);
      const display = result.current == null ? format.format(result.value) : `${format.format(result.current)} / ${format.format(result.value)}`;
      value.textContent = display;
      value.append(node('small', '', result.unit));
      row.append(icon(result.icon), helperButton(`${result.name}${result.state === 'normal' ? '' : ` ${result.state}`}`, result.id, result.icon, result.improved), value, removeResultButton(result));
      const sources = [result.originName ? `Umbra : ${result.originName}` : '',
        result.count ? `${result.count} source${result.count > 1 ? 's' : ''}` : '', result.qualifier].filter(Boolean);
      if (sources.length) row.append(node('div', 'lab-result-sources', sources.join(' · ')));
      container.append(row);
    }
  }
}

function renderSources() {
  const container = $('lab-sources');
  container.replaceChildren();
  if (!entries.length) { container.append(node('p', 'lab-empty', 'Aucune source ajoutée.')); return; }
  for (const entry of entries) {
    const spec = catalogs[entry.kind].find(spec => spec.key === entry.key);
    const row = node('div', 'lab-source');
    row.dataset.source = entry.id;
    const name = node('div', spec.icon, spec.name);
    const kind = entry.kind === 'umbra' ? 'Umbra' : entry.kind === 'improved' ? 'Stat autonome +' : 'Stat autonome';
    name.append(node('small', 'lab-source-kind', kind));
    const input = makeInput(spec, entry.value, `${spec.name}, source ${entry.id}`);
    input.addEventListener('change', () => {
      const value = inputValue(input, spec);
      if (value === null) return;
      entry.value = value;
      recalculate();
    });
    const remove = node('button', 'lab-remove', '×');
    remove.type = 'button';
    remove.title = `Retirer ${spec.name}`;
    remove.setAttribute('aria-label', remove.title);
    remove.addEventListener('click', () => { entries.splice(entries.indexOf(entry), 1); recalculate(); });
    row.append(icon(spec.icon), name, input, node('span', 'lab-unit', spec.unit), remove);
    container.append(row);
  }
}

async function recalculate() {
  closeHelper();
  const revision = ++latestCalculation;
  setStatus('Calcul en cours…');
  try {
    const next = await request('calculate', { entries, level: Number($('lab-level').value) || 1 });
    if (revision !== latestCalculation) return;
    snapshot = next;
    updateView();
  } catch (error) {
    if (revision !== latestCalculation) return;
    entries.splice(0, entries.length, ...snapshot.entries.map(entry => ({ ...entry })));
    updateView();
    setStatus(error.message, true);
  }
}

function updateView() {
  updateCatalogs();
  renderTotals();
  renderSources();
  $('result-count').textContent = String(snapshot.rows.length);
  $('source-count').textContent = String(entries.length);
  $('lab-reset').disabled = !entries.length;
  setStatus(`${entries.length} source${entries.length > 1 ? 's' : ''} · Niveau ${snapshot.level}`);
}

function closeHelper() {
  clearTimeout(hoverTimer);
  helperSequence++;
  popup.hidden = true;
  popup.replaceChildren();
  helperTarget = null;
  helperAnchor = null;
  pinned = false;
}

function placeHelper(anchor) {
  popup.style.visibility = 'hidden';
  popup.style.left = '12px';
  popup.style.top = '12px';
  popup.hidden = false;
  const rect = anchor.getBoundingClientRect();
  const size = popup.getBoundingClientRect();
  const right = Math.max(12, innerWidth - size.width - 12);
  const bottom = Math.max(12, innerHeight - size.height - 12);
  const top = rect.bottom + 8 + size.height <= innerHeight - 12 ? rect.bottom + 8 : rect.top - size.height - 8;
  popup.style.left = `${Math.max(12, Math.min(right, rect.left))}px`;
  popup.style.top = `${Math.max(12, Math.min(bottom, top))}px`;
  popup.style.visibility = 'visible';
}

async function showHelper(target, anchor) {
  clearTimeout(hoverTimer);
  const revision = ++helperSequence;
  helperTarget = target;
  helperAnchor = anchor;
  try {
    const detail = await request('helper', { target });
    if (revision !== helperSequence) return;
    const header = node('div', 'stat-hover-header');
    header.append(node('span', '', detail.title));
    const close = node('button', 'lab-remove', '×');
    close.type = 'button';
    close.title = 'Fermer';
    close.setAttribute('aria-label', 'Fermer le helper');
    close.addEventListener('click', closeHelper);
    header.append(close);
    const body = node('div', 'stat-hover-body');
    body.innerHTML = detail.html;
    const footer = node('div', 'stat-hover-footer', detail.footer);
    const subdetail = node('div', 'lab-detail');
    popup.replaceChildren(header, node('div', 'separation-line'), body, subdetail);
    if (detail.footer) popup.append(node('div', 'separation-line'), footer);
    let subRevision = 0;
    for (const part of body.querySelectorAll('[data-umbra-part]')) {
      const showPart = async () => {
        if (!pinned) return;
        const index = ++subRevision;
        const detail = await request('helper', { target, part: { calculation: part.dataset.umbraCalculation, index: Number(part.dataset.umbraPart) } });
        if (revision !== helperSequence || index !== subRevision) return;
        subdetail.replaceChildren(node('div', 'stat-hover-header', detail.title));
        const formula = node('div', 'stat-hover-body');
        formula.innerHTML = detail.html;
        subdetail.append(formula);
        placeHelper(anchor);
      };
      part.addEventListener('pointerenter', () => showPart().catch(error => setStatus(error.message, true)));
      part.addEventListener('focus', () => showPart().catch(error => setStatus(error.message, true)));
    }
    placeHelper(anchor);
  } catch (error) { if (revision === helperSequence) setStatus(error.message, true); }
}

popup.addEventListener('pointerenter', () => clearTimeout(hoverTimer));
popup.addEventListener('pointerleave', () => { if (!pinned) closeHelper(); });
document.addEventListener('click', event => { if (!popup.contains(event.target) && !event.target.closest('[data-helper-target]')) closeHelper(); });
document.addEventListener('keydown', event => { if (event.key === 'Escape') closeHelper(); });
addEventListener('resize', closeHelper);
document.addEventListener('scroll', event => { if (!pinned && !popup.contains(event.target)) closeHelper(); }, true);
$('lab-search').addEventListener('input', updateCatalogs);
$('lab-level').addEventListener('change', () => {
  const input = $('lab-level');
  if (!input.checkValidity()) { input.reportValidity(); return; }
  recalculate();
});
$('lab-reset').addEventListener('click', () => { entries.length = 0; recalculate(); });

function selectTab(tab) {
  activeTab = tab;
  for (const key of ['totals', 'sources']) {
    const selected = key === tab;
    $(`${key}-tab`).setAttribute('aria-selected', String(selected));
    $(`${key}-tab`).tabIndex = selected ? 0 : -1;
    $(`lab-${key}`).hidden = !selected;
  }
  closeHelper();
}
for (const key of ['totals', 'sources']) {
  $(`${key}-tab`).addEventListener('click', () => selectTab(key));
  $(`${key}-tab`).addEventListener('keydown', event => {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
    event.preventDefault();
    const next = event.key === 'Home' ? 'totals' : event.key === 'End' ? 'sources' : activeTab === 'totals' ? 'sources' : 'totals';
    selectTab(next);
    $(`${next}-tab`).focus();
  });
}

catalogs = CATALOGS;
snapshot = labSnapshot;
$('lab-level').max = String(B.level.progression.tableMaxLevel);
renderCatalogs();
updateView();
$('lab-search').disabled = false;
document.body.dataset.ready = 'true';

</script>
</body>
